[project]
name = "fullcontrol-workshop"
version = "1.0.0"
description = "Workshop notebooks for writing 3D printer toolpaths in Python with FullControl."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fullcontrol>=0.1.2",
    "marimo>=0.18.4",
    "numpy",
    "plotly",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop"]

[tool.marimo.runtime]
output_max_bytes = 10_000_000
